<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <title>アプリを選ぶ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: #26352f;
      background: #f7f4ed;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 12% 10%, #e8efe2 0, transparent 38%),
        radial-gradient(ellipse at 88% 90%, #f2e8d7 0, transparent 36%),
        #f7f4ed;
    }

    main { width: min(100%, 900px); }

    .intro { margin-bottom: 32px; }

    .eyebrow {
      margin: 0 0 10px;
      color: #66806f;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.4rem);
      letter-spacing: 0.02em;
    }

    .intro p:last-child {
      margin: 12px 0 0;
      color: #66736b;
      font-size: 1rem;
    }

    .page-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 16px;
    }

    .page-card {
      display: flex;
      min-height: 180px;
      flex-direction: column;
      align-items: flex-start;
      padding: 24px;
      border: 1px solid #e4e3d9;
      border-radius: 22px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 12px 30px rgb(49 62 51 / 7%);
      color: inherit;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .page-card:hover, .page-card:focus-visible {
      transform: translateY(-3px);
      border-color: #a7b9a9;
      box-shadow: 0 16px 34px rgb(49 62 51 / 12%);
      outline: none;
    }

    .page-icon { margin-bottom: 18px; font-size: 2rem; }
    .page-name { font-size: 1.2rem; font-weight: 700; }
    .page-description { margin-top: 8px; color: #66736b; font-size: 0.92rem; line-height: 1.5; }
    .page-file { margin-top: 8px; color: #89938c; font-size: 0.78rem; }
    .page-open { margin-top: auto; padding-top: 18px; color: #58745f; font-size: 0.9rem; font-weight: 700; }

    #status { color: #66736b; }
    #status[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <p class="eyebrow">WELCOME</p>
      <h1>開くページを選ぶ</h1>
      <p>遊びたいアプリを選択してください。</p>
    </header>
    <section id="pageList" class="page-list" aria-label="ページ一覧"></section>
    <p id="status" role="status">ページを読み込んでいます…</p>
  </main>

  <script>
    const pageDetails = {
      'bakery.html': {
        name: '森のちいさなパン屋さん',
        description: '森の動物たちにパンをおすすめしよう。',
        icon: '🥐',
      },
    };

    const pageList = document.querySelector('#pageList');
    const status = document.querySelector('#status');

    async function showPages() {
      try {
        const response = await fetch('/api/pages');
        if (!response.ok) throw new Error('ページ一覧を取得できませんでした');
        const pages = await response.json();

        for (const file of pages) {
          const details = pageDetails[file] || {
            name: file.replace(/\.html$/i, '').replace(/[-_]/g, ' '),
            description: 'このページを開きます。',
            icon: '📄',
          };
          const link = document.createElement('a');
          link.className = 'page-card';
          link.href = `/${encodeURIComponent(file)}`;

          const icon = document.createElement('span');
          icon.className = 'page-icon';
          icon.setAttribute('aria-hidden', 'true');
          icon.textContent = details.icon;

          const name = document.createElement('span');
          name.className = 'page-name';
          name.textContent = details.name;

          const description = document.createElement('span');
          description.className = 'page-description';
          description.textContent = details.description;

          const filename = document.createElement('span');
          filename.className = 'page-file';
          filename.textContent = file;

          const open = document.createElement('span');
          open.className = 'page-open';
          open.textContent = '開く →';

          link.append(icon, name, description, filename, open);
          pageList.append(link);
        }

        status.hidden = true;
        if (pages.length === 0) {
          status.hidden = false;
          status.textContent = '選べるHTMLページがありません。';
        }
      } catch (error) {
        status.textContent = 'ページ一覧を読み込めませんでした。サーバーを起動し直して再読み込みしてください。';
      }
    }

    showPages();
  </script>
</body>
</html>
